name = "streamvault-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"

# KV namespace for Stalker session/path caching
# Create with: wrangler kv namespace create SV_CACHE
[[kv_namespaces]]
binding = "SV_CACHE"
id = "19349a2f266640fab5a10a54e3fe67f6"  # Set your KV namespace ID here

# D1 database for persistent content storage
# Create with: wrangler d1 create streamvault-db
[[d1_databases]]
binding = "SV_DB"
database_name = "streamvault-db"
database_id = "7c07ba18-3924-4dfc-9ee3-08004acab0ee"  # Set your D1 database ID here
migrations_dir = "migrations"

# Daily cleanup: purge data for guests inactive > 7 days (runs at 3am UTC)
[triggers]
crons = ["0 3 * * *"]
